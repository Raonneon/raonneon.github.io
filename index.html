<script>
(function(){
var root=document.getElementById('bg');
function build(){
  root.innerHTML='';
  var W=innerWidth,H=innerHeight,cell=Math.max(150,Math.min(210,W/3)),seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  var cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1,html='';
  for(var r=-1;r<rows;r++)for(var c=-1;c<cols;c++){
    var x=c*cell+(r%2?cell/2:0)+(rnd()-.5)*cell*.3,y=r*cell+(rnd()-.5)*cell*.3;
    var h=70+rnd()*44,w=h*0.847,rot=(rnd()-.5)*16,flip=rnd()>.5?-1:1;
    var anim='animation-duration:'+(5+rnd()*8).toFixed(1)+'s;animation-delay:-'+(rnd()*12).toFixed(1)+'s';
    html+='<div class="r" style="left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;width:'+w.toFixed(0)+'px;height:'+h.toFixed(0)+'px;transform:rotate('+rot.toFixed(1)+'deg) scaleX('+flip+')">'
      +'<i class="base"></i><i class="glow" style="'+anim+'"></i></div>';
  }
  root.innerHTML=html;
}
build();
var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(build,200)});
})();
</script>
