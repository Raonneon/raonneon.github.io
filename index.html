<style>

#bg .r{position:absolute}
#bg svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;stroke-linecap:round;stroke-linejoin:round}
#bg .base{fill:#000;stroke:#000;opacity:.5}
#bg .glow{fill:rgba(225,225,245,.1);stroke:#e8e8f4;stroke-width:2.2;opacity:0;filter:drop-shadow(0 0 3px #fff) drop-shadow(0 0 10px #aeb0ff);animation:flick 7s linear infinite}
@keyframes flick{0%,17%{opacity:0}18%{opacity:1}19%{opacity:.15}20%{opacity:1}21%{opacity:0}23%{opacity:.9}24%{opacity:0}42%{opacity:0}43%{opacity:1}44%{opacity:.25}45%,66%{opacity:1}67%{opacity:.3}68%{opacity:1}74%{opacity:1}75%,100%{opacity:0}}
main{width:100%;max-width:420px;text-align:center}
h1{font-family:"Tilt Neon",system-ui,sans-serif;font-weight:400;font-size:clamp(3rem,16vw,5rem);line-height:1;margin-bottom:36px;color:#000;-webkit-text-stroke:1px rgba(255,255,255,.5);letter-spacing:.02em;
text-shadow:0 0 6px #000,0 0 16px #000,0 0 32px rgba(0,0,0,.85),0 0 60px rgba(0,0,0,.6);animation:on 1.4s steps(1) 1 both}
@keyframes on{0%{opacity:.1;text-shadow:none}10%{opacity:1}14%{opacity:.15}20%{opacity:1}26%{opacity:.3}34%,100%{opacity:1}}
p.tag{margin:14px 0 40px;color:var(--dim)}
ul{list-style:none;padding:0;display:grid;gap:12px}
a{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:block;padding:15px 18px;border:1px solid var(--line);border-radius:10px;color:var(--ink);text-decoration:none;font-weight:600;background:rgba(255,255,255,.2);transition:border-color .2s,box-shadow .2s}
a:hover,a:focus-visible{border-color:var(--cyan);box-shadow:0 0 18px rgba(0,0,0,.55);outline:none}

.btn,.phone{display:flex;align-items:center;justify-content:center;gap:12px}
.btn svg{width:22px;height:22px;flex:none}
.phone{color:var(--cyan);border-color:rgba(0,0,0,.6);letter-spacing:.04em}
.phone svg,.loc svg{width:20px;height:20px;flex:none}
.loc{-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);margin-top:28px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:rgba(255,255,255,.2);text-align:left}
.loc header{display:flex;align-items:center;gap:12px;padding:14px 18px}
.loc header svg{color:var(--pink);filter:drop-shadow(0 0 6px var(--pink))}
.loc b{display:block;font-weight:600}
.loc small{color:var(--dim)}
.map{position:relative;height:190px;border-top:1px solid var(--line)}
.map iframe{width:100%;height:100%;border:0;filter:grayscale(100%) contrast(.95)}
.loc a.open{border:0;border-top:1px solid var(--line);border-radius:0;text-align:center;color:var(--dim);font-weight:400;font-size:.9rem;padding:11px}
@media (prefers-reduced-motion:reduce){#bg .glow{animation:none}h1{animation:none}a{transition:none}}
</style>

<script>
(function(){
var root=document.getElementById('bg');
function build(){
  root.innerHTML='';
  var W=innerWidth,H=innerHeight,cell=Math.max(150,Math.min(210,W/3)),seed=7;
  function rnd(){seed=(seed*16807)%2147483647;return seed/2147483647}
  var cols=Math.ceil(W/cell)+1,rows=Math.ceil(H/cell)+1,html='';
  for(var r=-1;r<rows;r++)for(var c=-1;c<cols;c++){
    var x=c*cell+(r%2?cell/2:0)+(rnd()-.5)*cell*.3,y=r*cell+(rnd()-.5)*cell*.3;
    var h=80+rnd()*40,w=h*.59,rot=(rnd()-.5)*16,flip=rnd()>.5?-1:1;
    var anim='animation-duration:'+(5+rnd()*8).toFixed(1)+'s;animation-delay:-'+(rnd()*12).toFixed(1)+'s';
    html+='<div class="r" style="left:'+x.toFixed(0)+'px;top:'+y.toFixed(0)+'px;width:'+w.toFixed(0)+'px;height:'+h.toFixed(0)+'px;transform:rotate('+rot.toFixed(1)+'deg) scaleX('+flip+')">'
      +'<svg class="base" viewBox="12 -2 72 122"><use href="#reaper"/></svg>'
      +'<svg class="glow" viewBox="12 -2 72 122" style="'+anim+'"><use href="#reaper"/></svg></div>';
  }
  root.innerHTML=html;
}
build();
var t;addEventListener('resize',function(){clearTimeout(t);t=setTimeout(build,200)});
})();
</script>
